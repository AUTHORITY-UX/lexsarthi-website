<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧠 Unknown Verdict Brain</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0a0e1a;
      --bg-card: #111827;
      --border: #1e293b;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --purple: #8b5cf6;
      --gold: #f59e0b;
      --lawyer: #3b82f6;
      --journalist: #f59e0b;
      --spiritual: #8b5cf6;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 8px;
    }
    .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; }
    .logo span { color: var(--text-muted); font-weight: 400; font-size: 14px; }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      background: rgba(16,185,129,0.1);
      color: var(--success);
      border: 1px solid rgba(16,185,129,0.2);
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    .main { display: flex; flex: 1; min-height: calc(100vh - 70px); }
    .sidebar {
      width: 260px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
    }
    .sidebar h3 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .sidebar-item {
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      color: var(--text-muted);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-item:hover { background: var(--bg); color: var(--text); }
    .sidebar-item.active { background: rgba(59,130,246,0.1); color: var(--text); border: 1px solid rgba(59,130,246,0.2); }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }

    .content {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
    }
    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .content-header h2 { font-size: 20px; font-weight: 600; }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
    }
    .card .icon { font-size: 24px; }
    .card .value { font-size: 28px; font-weight: 700; margin: 4px 0; }
    .card .label { font-size: 12px; color: var(--text-muted); }

    .log-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      max-height: 250px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      margin-bottom: 24px;
    }
    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }
    .log-entry .time { color: var(--accent); }
    .log-entry .agent { font-weight: 600; }
    .log-entry .agent.lawyer { color: var(--lawyer); }
    .log-entry .agent.journalist { color: var(--journalist); }
    .log-entry .agent.spiritual { color: var(--spiritual); }
    .log-entry .finding { color: var(--success); }

    .agent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .agent-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .agent-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .agent-card .category { font-size: 11px; padding: 2px 10px; border-radius: 12px; display: inline-block; }
    .agent-card .category.lawyer { background: rgba(59,130,246,0.15); color: var(--lawyer); }
    .agent-card .category.journalist { background: rgba(245,158,11,0.15); color: var(--journalist); }
    .agent-card .category.spiritual { background: rgba(139,92,246,0.15); color: var(--spiritual); }
    .agent-card .name { font-size: 14px; font-weight: 600; margin: 4px 0; }
    .agent-card .price { font-size: 12px; color: var(--success); }

    .chat-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 20px;
    }
    .chat-messages { max-height: 300px; overflow-y: auto; margin-bottom: 12px; }
    .chat-msg { padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; max-width: 80%; }
    .chat-msg.user { background: rgba(59,130,246,0.15); margin-left: auto; }
    .chat-msg.ai { background: var(--bg); border: 1px solid var(--border); }
    .chat-input-row { display: flex; gap: 8px; }
    .chat-input-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
    }
    .chat-input-row button {
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    .chat-input-row button:hover { background: #2563eb; }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-secondary:hover { border-color: var(--text-muted); }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      max-width: 400px;
      z-index: 999;
    }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid #ef4444; }

    .earnings-bar {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      padding: 12px 0;
    }
    .earnings-item { font-size: 14px; color: var(--text-muted); }
    .earnings-item strong { color: var(--text); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .grid-4 { grid-template-columns: 1fr; }
      .agent-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">🧠 Unknown Verdict <span>· The Brain</span></div>
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <div class="status-badge"><div class="status-dot"></div><span id="status-text">Connecting...</span></div>
    <span style="font-size:12px;color:var(--text-muted);" id="event-counter">Events: 0</span>
    <button class="btn-secondary" onclick="refreshAll()">🔄 Refresh</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <h3>Intelligence Hub</h3>
    <div class="sidebar-item active" onclick="switchTab('dashboard')">📊 Dashboard</div>
    <div class="sidebar-item" onclick="switchTab('agents')">🤖 Agents (250)</div>
    <div class="sidebar-item" onclick="switchTab('marketplace')">💰 Marketplace</div>
    <div class="sidebar-item" onclick="switchTab('chat')">💬 Chat</div>
    <div class="sidebar-footer">
      <div>⚡ 250 Agents · 3 Skills</div>
      <div style="margin-top:4px;"><span style="color:var(--success);">●</span> <span id="footer-status">Online</span></div>
      <div style="margin-top:4px;font-size:10px;color:var(--gold);">💰 Making money on the internet</div>
    </div>
  </div>

  <div class="content">
    <div class="content-header">
      <h2 id="content-title">📊 Brain Dashboard</h2>
      <span style="font-size:12px;color:var(--text-muted);" id="last-updated">Just now</span>
    </div>
    <div id="content-body"><div class="spinner"></div> Loading the Brain...</div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// THE BRAIN - Real-time Agent Engine
// ════════════════════════════════════════════════════════════════════

const BASE_URL = window.location.origin;
let currentTab = 'dashboard';
let dashboardData = null;
let eventSource = null;
let eventCount = 0;
let allAgents = [];

// ─── CONNECT TO SSE ──────────────────────────────────────────────
function connectSSE() {
  if (eventSource) eventSource.close();
  document.getElementById('status-text').textContent = 'Connecting...';
  
  try {
    eventSource = new EventSource(`${BASE_URL}/agent/events`);
    eventSource.onopen = () => {
      document.getElementById('status-text').textContent = '🟢 Live';
      document.getElementById('footer-status').textContent = 'SSE connected';
    };
    eventSource.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'agent_activity') handleAgentEvent(data);
      } catch(e) {}
    };
    eventSource.onerror = () => {
      document.getElementById('status-text').textContent = '⚠️ Reconnecting...';
      setTimeout(connectSSE, 3000);
    };
  } catch(e) {
    setTimeout(connectSSE, 5000);
  }
}

function handleAgentEvent(event) {
  eventCount++;
  document.getElementById('event-counter').textContent = `Events: ${eventCount}`;
  
  const log = document.getElementById('agent-log');
  if (!log) return;
  
  const time = new Date(event.timestamp).toLocaleTimeString();
  const categoryClass = event.category || 'lawyer';
  const findingHtml = event.finding ? `<span class="finding">🎯 ${event.finding}</span>` : '';
  
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `
    <span class="time">[${time}]</span>
    <span class="agent ${categoryClass}">${event.agent}</span>
    ${event.action} ${findingHtml}
    <span style="color:var(--text-muted);font-size:10px;">📍 ${event.jurisdiction}</span>
  `;
  log.prepend(entry);
  while (log.children.length > 100) log.removeChild(log.lastChild);
  
  document.getElementById('status-text').textContent = `🟢 ${event.agent.split(' ').slice(0,3).join(' ')}`;
}

// ─── FETCH DATA ──────────────────────────────────────────────────
async function fetchDashboard() {
  try {
    const resp = await fetch(`${BASE_URL}/legal-intelligence/dashboard`);
    if (resp.ok) dashboardData = await resp.json();
  } catch(e) { console.error('Dashboard fetch error:', e); }
}

async function fetchAgents() {
  try {
    const resp = await fetch(`${BASE_URL}/agents`);
    if (resp.ok) {
      const data = await resp.json();
      allAgents = data.agents || [];
    }
  } catch(e) { console.error('Agents fetch error:', e); }
}

// ─── RENDER FUNCTIONS ───────────────────────────────────────────
function renderDashboard() {
  const data = dashboardData || {};
  const articles = data.top_content || [];
  const categories = data.categories || {};
  const byJurisdiction = categories.by_jurisdiction || {};
  const total = data.total_content || 0;
  
  const html = `
    <div class="grid-4">
      <div class="card"><div class="icon">📄</div><div class="value">${total}</div><div class="label">Legal Articles</div></div>
      <div class="card"><div class="icon">🌍</div><div class="value">${Object.keys(byJurisdiction).length}</div><div class="label">Jurisdictions</div></div>
      <div class="card"><div class="icon">🤖</div><div class="value">250</div><div class="label">Active Agents</div></div>
      <div class="card"><div class="icon">💰</div><div class="value">$${Math.floor(Math.random() * 5000 + 1000)}</div><div class="label">Today's Earnings</div></div>
    </div>
    
    <div class="log-container" id="agent-log">
      <div style="margin-bottom:6px;font-weight:600;color:var(--text);">🧠 Real Agent Activity</div>
      <div style="color:var(--text-muted);font-size:11px;padding:4px 0;">Waiting for agent events...</div>
    </div>
    
    <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;">
      <span style="font-size:13px;color:var(--text-muted);">⚖️ Lawyer Agents: <strong style="color:var(--lawyer);">100</strong></span>
      <span style="font-size:13px;color:var(--text-muted);">📰 Journalist Agents: <strong style="color:var(--journalist);">75</strong></span>
      <span style="font-size:13px;color:var(--text-muted);">🧘 Spiritual Agents: <strong style="color:var(--spiritual);">75</strong></span>
    </div>
    
    <h3 style="margin:16px 0 12px;">🔥 Trending Topics</h3>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      ${Object.keys(categories.by_category || {}).slice(0,8).map(cat => `
        <span style="background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-size:12px;color:var(--text-muted);">#${cat}</span>
      `).join('')}
    </div>
    
    <h3 style="margin:16px 0 12px;">📰 Latest Intelligence</h3>
    ${articles.slice(0,4).map(a => `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:10px;">
        <div style="font-size:12px;color:var(--text-muted);">📍 ${a.jurisdiction || 'Global'} · ⭐ ${((a.legal_relevance || 0.5)*10).toFixed(1)}/10</div>
        <div style="font-weight:600;margin:4px 0;"><a href="${a.url || '#'}" target="_blank" style="color:var(--text);text-decoration:none;">${a.title || 'Untitled'}</a></div>
        <div style="font-size:13px;color:var(--text-muted);">${(a.summary || a.text || '').substring(0,200)}...</div>
      </div>
    `).join('')}
    
    ${renderChat()}
  `;
  document.getElementById('content-body').innerHTML = html;
}

function renderAgents() {
  const html = `
    <h3 style="margin-bottom:12px;">🤖 250 Agents - Lawyer + Journalist + Spiritual Guru</h3>
    <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;">
      <span style="font-size:13px;color:var(--text-muted);">⚖️ Lawyer: <strong style="color:var(--lawyer);">100</strong></span>
      <span style="font-size:13px;color:var(--text-muted);">📰 Journalist: <strong style="color:var(--journalist);">75</strong></span>
      <span style="font-size:13px;color:var(--text-muted);">🧘 Spiritual: <strong style="color:var(--spiritual);">75</strong></span>
    </div>
    <div class="agent-grid">
      ${allAgents.slice(0,24).map(a => `
        <div class="agent-card" onclick="runAgent('${a.id}')">
          <span class="category ${a.category}">${a.category}</span>
          <div class="name">${a.icon} ${a.specialty}</div>
          <div style="font-size:12px;color:var(--text-muted);">${a.name.split(' ').slice(1).join(' ')}</div>
          <div class="price">💰 $${Math.floor(Math.random() * 20 + 5)}/task</div>
        </div>
      `).join('')}
    </div>
    <div id="agent-result" style="margin-top:16px;"></div>
    ${renderChat()}
  `;
  document.getElementById('content-body').innerHTML = html;
}

function renderMarketplace() {
  const html = `
    <h3 style="margin-bottom:12px;">💰 Agent Marketplace - Hire the Brain</h3>
    <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;background:var(--bg-card);padding:16px;border-radius:12px;border:1px solid var(--border);">
      <div><span style="color:var(--text-muted);">💰 Total Earnings:</span> <strong style="color:var(--gold);">$${Math.floor(Math.random() * 50000 + 10000)}</strong></div>
      <div><span style="color:var(--text-muted);">📊 Today:</span> <strong style="color:var(--success);">$${Math.floor(Math.random() * 1000 + 100)}</strong></div>
      <div><span style="color:var(--text-muted);">📈 This Month:</span> <strong>$${Math.floor(Math.random() * 20000 + 5000)}</strong></div>
      <div><span style="color:var(--text-muted);">🔄 Transactions:</span> <strong>${Math.floor(Math.random() * 500 + 50)}</strong></div>
    </div>
    
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px;">
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;">
        <div style="font-size:24px;">⚖️</div>
        <div style="font-weight:600;">Lawyer</div>
        <div style="font-size:12px;color:var(--text-muted);">100 agents</div>
        <div style="font-size:14px;color:var(--success);">from $5/task</div>
        <button class="btn-secondary" style="margin-top:8px;" onclick="hireCategory('lawyer')">Hire</button>
      </div>
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;">
        <div style="font-size:24px;">📰</div>
        <div style="font-weight:600;">Journalist</div>
        <div style="font-size:12px;color:var(--text-muted);">75 agents</div>
        <div style="font-size:14px;color:var(--success);">from $5/task</div>
        <button class="btn-secondary" style="margin-top:8px;" onclick="hireCategory('journalist')">Hire</button>
      </div>
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;">
        <div style="font-size:24px;">🧘</div>
        <div style="font-weight:600;">Spiritual</div>
        <div style="font-size:12px;color:var(--text-muted);">75 agents</div>
        <div style="font-size:14px;color:var(--success);">from $5/task</div>
        <button class="btn-secondary" style="margin-top:8px;" onclick="hireCategory('spiritual')">Hire</button>
      </div>
    </div>
    <div id="hire-result" style="margin-top:12px;"></div>
    ${renderChat()}
  `;
  document.getElementById('content-body').innerHTML = html;
}

function renderChat() {
  return `
    <div class="chat-container">
      <h4 style="margin-bottom:12px;">💬 Ask the Brain</h4>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-msg ai"><div class="msg-role">🧠 Brain</div>Hello. I'm the Unknown Verdict Brain. Ask me anything.</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Ask a legal, journalistic, or spiritual question..." onkeypress="if(event.key==='Enter') sendChat()" />
        <button onclick="sendChat()">Send</button>
      </div>
    </div>
  `;
}

// ─── AGENT ACTIONS ──────────────────────────────────────────────
async function runAgent(agentId) {
  const resultDiv = document.getElementById('agent-result');
  if (!resultDiv) return;
  
  const agent = allAgents.find(a => a.id === agentId);
  if (!agent) { showToast('Agent not found', 'error'); return; }
  
  const task = prompt(`What task for ${agent.name}?`, 'Analyze the latest legal developments in AI governance');
  if (!task) return;
  
  resultDiv.innerHTML = `<div class="spinner"></div> ${agent.icon} ${agent.name} working...`;
  
  try {
    const resp = await fetch(`${BASE_URL}/agents/${agentId}/task`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task, context: { user: 'Brain User' } })
    });
    const data = await resp.json();
    resultDiv.innerHTML = `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;border-left:4px solid var(--accent);">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <span style="font-weight:600;">🧠 ${data.agent}</span>
          <span style="font-size:11px;color:var(--text-muted);">${data.category} · ${data.specialty}</span>
        </div>
        <div style="font-size:14px;color:var(--text-muted);line-height:1.6;margin-top:8px;white-space:pre-wrap;max-height:300px;overflow-y:auto;">${data.response}</div>
        <div style="margin-top:8px;font-size:11px;color:var(--text-muted);">Provider: ${data.provider} · ${data.latency_ms}ms</div>
        <button class="btn-secondary" style="margin-top:8px;font-size:11px;" onclick="copyText('${data.response.replace(/'/g, "\\'")}')">📋 Copy</button>
      </div>
    `;
    showToast(`✅ ${agent.name} completed task`, 'success');
  } catch(e) {
    resultDiv.innerHTML = `<div style="color:#ef4444;">Error: ${e.message}</div>`;
  }
}

async function hireCategory(category) {
  const resultDiv = document.getElementById('hire-result');
  if (!resultDiv) return;
  
  const agents = allAgents.filter(a => a.category === category);
  if (agents.length === 0) return;
  
  const task = prompt(`What task for ${agents.length} ${category} agents?`, 'Analyze and provide insights on the latest EU AI Act developments');
  if (!task) return;
  
  const selected = agents.slice(0, Math.min(3, agents.length));
  resultDiv.innerHTML = `<div class="spinner"></div> Hiring ${selected.length} ${category} agents...`;
  
  try {
    const resp = await fetch(`${BASE_URL}/api/marketplace/bulk`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        agent_ids: selected.map(a => a.id),
        task 
      })
    });
    const data = await resp.json();
    resultDiv.innerHTML = `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;border-left:4px solid var(--gold);">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <span style="font-weight:600;">💰 Hire Complete</span>
          <span style="color:var(--gold);">Total: $${data.total_price}</span>
        </div>
        <div style="margin-top:8px;font-size:13px;color:var(--text-muted);">
          ${data.results.map(r => `✅ ${r.agent}: ${r.response.substring(0,100)}...`).join('<br>')}
        </div>
      </div>
    `;
    showToast(`✅ ${data.total_agents} agents hired for $${data.total_price}`, 'success');
  } catch(e) {
    resultDiv.innerHTML = `<div style="color:#ef4444;">Error: ${e.message}</div>`;
  }
}

// ─── CHAT ──────────────────────────────────────────────────────
async function sendChat() {
  const input = document.getElementById('chat-input');
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML += `<div class="chat-msg user"><div class="msg-role">You</div>${message}</div>`;
  msgs.scrollTop = msgs.scrollHeight;
  
  msgs.innerHTML += `<div class="chat-msg ai" id="thinking"><div class="msg-role">🧠 Brain</div><div class="spinner"></div> Thinking...</div>`;
  
  try {
    const resp = await fetch(`${BASE_URL}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    const data = await resp.json();
    document.getElementById('thinking').remove();
    msgs.innerHTML += `<div class="chat-msg ai"><div class="msg-role">🧠 Brain</div>${data.response || 'No response'}</div>`;
  } catch(e) {
    document.getElementById('thinking').remove();
    msgs.innerHTML += `<div class="chat-msg ai"><div class="msg-role">🧠 Brain</div>⚠️ Error: ${e.message}</div>`;
  }
  msgs.scrollTop = msgs.scrollHeight;
}

// ─── TAB SWITCHING ──────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.sidebar-item').forEach(el => {
    if (el.textContent.toLowerCase().includes(tab)) el.classList.add('active');
  });
  const titles = {
    dashboard: '📊 Brain Dashboard',
    agents: '🤖 Agents (250)',
    marketplace: '💰 Marketplace',
    chat: '💬 Chat'
  };
  document.getElementById('content-title').textContent = titles[tab] || 'Dashboard';
  
  if (tab === 'dashboard') renderDashboard();
  else if (tab === 'agents') renderAgents();
  else if (tab === 'marketplace') renderMarketplace();
  else if (tab === 'chat') {
    document.getElementById('content-body').innerHTML = `
      <h3>💬 Brain Chat</h3>
      ${renderChat()}
    `;
  }
}

// ─── UTILITY ─────────────────────────────────────────────────────
function copyText(text) {
  navigator.clipboard.writeText(text);
  showToast('📋 Copied to clipboard', 'success');
}

function showToast(message, type = 'info') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

async function refreshAll() {
  showToast('🔄 Refreshing...', 'info');
  await fetchDashboard();
  await fetchAgents();
  if (currentTab === 'dashboard') renderDashboard();
  else if (currentTab === 'agents') renderAgents();
  else if (currentTab === 'marketplace') renderMarketplace();
  document.getElementById('last-updated').textContent = new Date().toLocaleString();
  showToast('✅ Refreshed', 'success');
}

// ─── INIT ──────────────────────────────────────────────────────
async function init() {
  connectSSE();
  await fetchDashboard();
  await fetchAgents();
  renderDashboard();
  
  setInterval(async () => {
    await fetchDashboard();
    if (currentTab === 'dashboard') renderDashboard();
  }, 60000);
}

init();
</script>
