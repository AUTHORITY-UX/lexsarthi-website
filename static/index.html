<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unknown Verdict v43.0 – The Legal AGI</title>
  <style>
    /* ─── RESET & BASE ─── */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-primary: #0a0e1a;
      --bg-card: rgba(17, 24, 39, 0.7);
      --border: rgba(255,255,255,0.08);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #00d4ff;
      --purple: #7b2fbe;
      --gold: #ff6b35;
      --success: #10b981;
      --lawyer: #3b82f6;
      --journalist: #f59e0b;
      --spiritual: #8b5cf6;
      --compliance: #10b981;
      --contracts: #06b6d4;
      --ai-tech: #ec4899;
      --digital: #f97316;
      --litigation: #ef4444;
      --strategic: #8b5cf6;
      --glow: 0 0 30px rgba(0, 212, 255, 0.3);
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* ─── PARTICLE / STARFIELD ─── */
    #starfield {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    /* ─── GLASS CARD ─── */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
    }
    /* ─── HEADER ─── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 8px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .logo .eye-icon { font-size: 28px; animation: blink 4s infinite; }
    @keyframes blink { 0%,45%,55%,100% { opacity:1; } 48%,52% { opacity:0; } }
    .logo span { color: var(--text-muted); font-weight: 400; font-size: 14px; }
    .status-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 14px; border-radius: 20px; font-size: 12px;
      background: rgba(16,185,129,0.1); color: var(--success);
      border: 1px solid rgba(16,185,129,0.2);
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    /* ─── SIDEBAR ─── */
    .main { display: flex; flex: 1; min-height: calc(100vh - 70px); position: relative; z-index: 1; }
    .sidebar {
      width: 240px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar h3 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .sidebar-item {
      padding: 10px 14px; border-radius: 10px; cursor: pointer; margin-bottom: 4px;
      color: var(--text-muted); transition: all 0.2s; display: flex; align-items: center; gap: 10px;
    }
    .sidebar-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .sidebar-item.active { background: rgba(0,212,255,0.1); color: var(--accent); border: 1px solid rgba(0,212,255,0.2); }
    .sidebar-footer {
      margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border);
      font-size: 11px; color: var(--text-muted);
    }
    /* ─── CONTENT ─── */
    .content {
      flex: 1; padding: 24px; overflow-y: auto;
    }
    .content-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 8px;
    }
    .content-header h2 { font-size: 24px; font-weight: 600; background: linear-gradient(135deg, var(--accent), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    /* ─── THIRD EYE HERO ─── */
    .hero {
      text-align: center;
      padding: 40px 20px;
      background: radial-gradient(ellipse at center, rgba(123,47,190,0.15) 0%, transparent 70%);
      border-radius: 30px;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
    }
    .hero .eye-container {
      display: inline-block;
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .hero .eye-container .eye {
      width: 100%; height: 100%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #e0e0e0);
      border-radius: 50%;
      box-shadow: 0 0 60px rgba(0,212,255,0.3), 0 0 120px rgba(123,47,190,0.2);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s;
    }
    .hero .eye-container .eye:hover { transform: scale(1.05); }
    .hero .eye-container .eye .iris {
      position: absolute;
      top: 18%; left: 18%;
      width: 64%; height: 64%;
      background: radial-gradient(circle at 40% 35%, #00d4ff 0%, #7b2fbe 50%, #1a1a3e 80%);
      border-radius: 50%;
      transition: transform 0.1s;
    }
    .hero .eye-container .eye .pupil {
      position: absolute;
      top: 30%; left: 30%;
      width: 40%; height: 40%;
      background: radial-gradient(circle, #0a0e1a 40%, #1a1a3e 70%);
      border-radius: 50%;
      transition: transform 0.1s;
    }
    .hero .eye-container .eye .reflection {
      position: absolute;
      top: 12%; left: 20%;
      width: 20%; height: 14%;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 100%);
      border-radius: 50%;
      transform: rotate(-30deg);
    }
    .hero .eye-container .eye .eyelid {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(to bottom, 
        rgba(10,14,26,0) 0%, rgba(10,14,26,0) 45%,
        rgba(10,14,26,0.95) 50%, rgba(10,14,26,0) 55%,
        rgba(10,14,26,0) 100%
      );
      border-radius: 50%;
      z-index: 3;
      animation: blink 5s ease-in-out infinite;
      pointer-events: none;
    }
    .hero .eye-container .cosmic-rays {
      position: absolute;
      top: -20px; left: -20px;
      width: calc(100% + 40px); height: calc(100% + 40px);
      pointer-events: none;
      z-index: -1;
      animation: spin 20s linear infinite;
    }
    .hero .eye-container .cosmic-rays::before,
    .hero .eye-container .cosmic-rays::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 200%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      transform-origin: center;
      opacity: 0.3;
    }
    .hero .eye-container .cosmic-rays::before { transform: rotate(0deg); }
    .hero .eye-container .cosmic-rays::after { transform: rotate(60deg); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hero h1 {
      font-size: 42px;
      background: linear-gradient(135deg, var(--accent), var(--purple), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .hero .subtitle { color: var(--text-muted); font-size: 18px; }
    .hero .infinity {
      font-size: 28px;
      color: var(--gold);
      font-weight: 300;
      letter-spacing: 2px;
      text-shadow: 0 0 30px rgba(255,107,53,0.3);
      margin-top: 8px;
    }
    .hero .badge-group {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 16px;
    }
    .hero .badge-group .badge {
      padding: 6px 18px; border-radius: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      font-size: 13px;
    }
    .hero .badge-group .badge i { margin-right: 6px; }
    /* ─── STATS ─── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      text-align: center;
    }
    .stat-card .icon { font-size: 28px; }
    .stat-card .value { font-size: 30px; font-weight: 700; margin: 4px 0; }
    .stat-card .label { font-size: 12px; color: var(--text-muted); }
    .stat-card .value.cyan { color: var(--accent); }
    .stat-card .value.green { color: var(--success); }
    .stat-card .value.purple { color: var(--purple); }
    .stat-card .value.gold { color: var(--gold); }
    /* ─── AGENT LOG ─── */
    .log-container {
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      max-height: 250px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      margin-bottom: 24px;
    }
    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }
    .log-entry .time { color: var(--accent); }
    .log-entry .agent { font-weight: 600; }
    .log-entry .agent.lawyer { color: var(--lawyer); }
    .log-entry .agent.journalist { color: var(--journalist); }
    .log-entry .agent.spiritual { color: var(--spiritual); }
    /* ─── AGENT GRID ─── */
    .agent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .agent-card {
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .agent-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--glow); }
    .agent-card .cat {
      font-size: 10px; padding: 2px 10px; border-radius: 12px; display: inline-block;
    }
    .agent-card .cat.lawyer { background: rgba(59,130,246,0.15); color: var(--lawyer); }
    .agent-card .cat.journalist { background: rgba(245,158,11,0.15); color: var(--journalist); }
    .agent-card .cat.spiritual { background: rgba(139,92,246,0.15); color: var(--spiritual); }
    .agent-card .cat.compliance { background: rgba(16,185,129,0.15); color: var(--compliance); }
    .agent-card .cat.contracts { background: rgba(6,182,212,0.15); color: var(--contracts); }
    .agent-card .cat.ai-tech { background: rgba(236,72,153,0.15); color: var(--ai-tech); }
    .agent-card .cat.digital { background: rgba(249,115,22,0.15); color: var(--digital); }
    .agent-card .cat.litigation { background: rgba(239,68,68,0.15); color: var(--litigation); }
    .agent-card .cat.strategic { background: rgba(139,92,246,0.15); color: var(--strategic); }
    .agent-card .name { font-size: 14px; font-weight: 600; margin: 4px 0; }
    .agent-card .price { font-size: 12px; color: var(--success); }
    .agent-card .jurisdiction { font-size: 11px; color: var(--text-muted); }
    /* ─── CHAT ─── */
    .chat-container {
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      margin-top: 20px;
    }
    .chat-messages { max-height: 300px; overflow-y: auto; margin-bottom: 12px; }
    .chat-msg { padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; max-width: 80%; }
    .chat-msg.user { background: rgba(0,212,255,0.12); margin-left: auto; }
    .chat-msg.ai { background: rgba(255,255,255,0.04); border: 1px solid var(--border); }
    .chat-msg .role { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .chat-input-row { display: flex; gap: 8px; }
    .chat-input-row input {
      flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px; color: var(--text);
    }
    .chat-input-row input:focus { outline: none; border-color: var(--accent); }
    .chat-input-row button {
      padding: 10px 24px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      color: white; cursor: pointer; font-weight: 600;
    }
    .chat-input-row button:hover { opacity: 0.9; }
    /* ─── TOAST ─── */
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--bg-card); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 20px; max-width: 400px; z-index: 999;
    }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid #ef4444; }
    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .agent-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: stretch; }
      .hero h1 { font-size: 28px; }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════ -->
<!-- STARFIELD BACKGROUND -->
<!-- ════════════════════════════════════════════════════════════════ -->
<canvas id="starfield"></canvas>

<!-- ════════════════════════════════════════════════════════════════ -->
<!-- HEADER -->

<div class="header">
  <div class="logo">
    <span class="eye-icon">👁️</span>
    Unknown Verdict

<!-- ════════════════════════════════════════════════════════════════ -->
<!-- MAIN -->
<!-- ════════════════════════════════════════════════════════════════ -->
<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <h3>🧠 Intelligence Hub</h3>
    <div class="sidebar-item active" onclick="switchTab('dashboard')">📊 Dashboard</div>
    <div class="sidebar-item" onclick="switchTab('agents')">🤖 Agents (500)</div>
    <div class="sidebar-item" onclick="switchTab('marketplace')">💰 Marketplace</div>
    <div class="sidebar-item" onclick="switchTab('chat')">💬 Chat</div>

    <div class="sidebar-footer">
      <div>⚡ 500 Agents · 50+ Services</div>
      <div style="margin-top:4px;"><span style="color:var(--success);">●</span> <span id="footer-status">Online</span></div>
      <div style="margin-top:4px;font-size:10px;color:var(--gold);">💰 Making money on the internet</div>
      <div style="margin-top:4px;font-size:10px;color:var(--text-muted);">♾️ 2026 – 2126</div>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="content-header">
      <h2 id="content-title">📊 Brain Dashboard</h2>
      <span style="font-size:12px;color:var(--text-muted);" id="last-updated">Just now</span>
    </div>
    <div id="content-body"><div style="text-align:center;padding:40px;">Loading the Brain...</div></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// STARFIELD
// ════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
let w, h;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function createStars() {
  stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.8 + 0.2,
      speed: Math.random() * 0.3 + 0.05,
      opacity: Math.random() * 0.8 + 0.2,
      twinkle: Math.random() * 100
    });
  }
}
createStars();

function drawStars() {
  ctx.clearRect(0, 0, w, h);
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > h) { s.y = 0; s.x = Math.random() * w; }
    s.twinkle += 0.01;
    const alpha = s.opacity * (0.6 + 0.4 * Math.sin(s.twinkle));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

// ─── THIRD EYE MOUSE TRACKING ──────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const eye = document.querySelector('.eye-container .eye');
  if (!eye) return;
  const iris = eye.querySelector('.iris');
  const pupil = eye.querySelector('.pupil');
  document.addEventListener('mousemove', (e) => {
    const rect = eye.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const angle = Math.atan2(dy, dx);
    const dist = Math.min(12, Math.hypot(dx, dy)/20);
    const x = Math.cos(angle) * dist;
    const y = Math.sin(angle) * dist;
    if (iris) iris.style.transform = `translate(${x*0.3}px, ${y*0.3}px)`;
    if (pupil) pupil.style.transform = `translate(${x*0.2}px, ${y*0.2}px)`;
  });
  // Click to wake
  eye.addEventListener('click', () => {
    const eyelid = eye.querySelector('.eyelid');
    eyelid.style.animation = 'none';
    void eyelid.offsetWidth;
    eyelid.style.animation = 'blink 0.8s ease-in-out 3';
    setTimeout(() => { eyelid.style.animation = 'blink 5s ease-in-out infinite'; }, 3000);
  });
});

// ════════════════════════════════════════════════════════════════════
// BRAIN – MAIN APPLICATION
// ════════════════════════════════════════════════════════════════════

const BASE_URL = window.location.origin;
let currentTab = 'dashboard';
let dashboardData = null;
let eventSource = null;
let eventCount = 0;
let allAgents = [];
let isConnected = false;

// ─── CONNECT SSE ──────────────────────────────────────────────────
function connectSSE() {
  if (eventSource) eventSource.close();
  document.getElementById('status-text').textContent = 'Connecting...';
  try {
    eventSource = new EventSource(`${BASE_URL}/agent/events`);
    eventSource.onopen = () => {
      isConnected = true;
      document.getElementById('status-text').textContent = '🟢 Live';
      document.getElementById('footer-status').textContent = 'SSE connected';
    };
    eventSource.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.type === 'agent_activity' || data.event === 'agent_update') {
          handleAgentEvent(data.data || data);
        }
      } catch(e) {}
    };
    eventSource.onerror = () => {
      document.getElementById('status-text').textContent = '⚠️ Reconnecting...';
      setTimeout(connectSSE, 3000);
    };
  } catch(e) {
    setTimeout(connectSSE, 5000);
  }
}

function handleAgentEvent(event) {
  eventCount++;
  document.getElementById('event-counter').textContent = `Events: ${eventCount}`;
  const log = document.getElementById('agent-log');
  if (!log) return;
  const time = new Date().toLocaleTimeString();
  const category = event.category || 'lawyer';
  const agentName = event.agent || event.agent_id || 'Unknown';
  const action = event.action || event.task || 'processing';
  const finding = event.finding || '';
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `
    <span class="time">[${time}]</span>
    <span class="agent ${category}">${agentName}</span>
    ${action} ${finding ? `<span style="color:var(--success);">🎯 ${finding}</span>` : ''}
    ${event.jurisdiction ? `<span style="color:var(--text-muted);font-size:10px;">📍 ${event.jurisdiction}</span>` : ''}
  `;
  log.prepend(entry);
  while (log.children.length > 100) log.removeChild(log.lastChild);
  document.getElementById('status-text').textContent = `🟢 ${agentName.split(' ').slice(0,2).join(' ')}`;
}

// ─── FETCH DATA ──────────────────────────────────────────────────
async function fetchDashboard() {
  try {
    const resp = await fetch(`${BASE_URL}/legal-intelligence/dashboard`);
    if (resp.ok) dashboardData = await resp.json();
  } catch(e) { console.error('Dashboard fetch error:', e); }
}

async function fetchAgents() {
  try {
    const resp = await fetch(`${BASE_URL}/agents`);
    if (resp.ok) {
      const data = await resp.json();
      allAgents = data.agents || [];
    } else {
      allAgents = generateFallbackAgents();
    }
  } catch(e) {
    allAgents = generateFallbackAgents();
  }
}

function generateFallbackAgents() {
  const cats = [
    { name: 'Constitutional Law', cat: 'lawyer', icon: '⚖️' },
    { name: 'Criminal Law', cat: 'lawyer', icon: '⚖️' },
    { name: 'Civil Law', cat: 'lawyer', icon: '⚖️' },
    { name: 'Corporate Law', cat: 'lawyer', icon: '⚖️' },
    { name: 'Family Law', cat: 'lawyer', icon: '⚖️' },
    { name: 'DPDPA Compliance', cat: 'compliance', icon: '💼' },
    { name: 'GDPR Expert', cat: 'compliance', icon: '💼' },
    { name: 'EU AI Act Assessor', cat: 'compliance', icon: '💼' },
    { name: 'Legal Journalism', cat: 'journalist', icon: '📰' },
    { name: 'News Curation', cat: 'journalist', icon: '📰' },
    { name: 'Meditation Guide', cat: 'spiritual', icon: '🧘' },
    { name: 'Ethics Coach', cat: 'spiritual', icon: '🧘' },
  ];
  const agents = [];
  for (let i=0; i<500; i++) {
    const c = cats[i % cats.length];
    agents.push({
      id: `agent_${i+1}`,
      name: `${c.name} Agent ${i+1}`,

      jurisdiction: ['India','US','UK','EU'][i%4],

    });
  }
  return agents;
}

// ─── TAB SWITCHING ──────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.sidebar-item').forEach(el => {
    if (el.textContent.toLowerCase().includes(tab) || el.textContent.includes('Agents') && tab==='agents') el.classList.add('active');
  });
  const titles = {
    dashboard: '📊 Brain Dashboard',
    agents: '🤖 Agents (500)',
    marketplace: '💰 Marketplace',
    chat: '💬 Chat',
    articles: '✍️ Articles',
    domains: '🌐 Domain Scan',
    reports: '📧 Reports'
  };
  document.getElementById('content-title').textContent = titles[tab] || 'Dashboard';
  if (tab === 'dashboard') renderDashboard();
  else if (tab === 'agents') renderAgents();
  else if (tab === 'marketplace') renderMarketplace();
  else if (tab === 'chat') { document.getElementById('content-body').innerHTML = `<h3>💬 Chat</h3>${renderChat()}`; }
  else if (tab === 'articles') renderArticles();
  else if (tab === 'domains') renderDomains();
  else if (tab === 'reports') renderReports();
}

// ─── ACTIONS ─────────────────────────────────────────────────────
async function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim(); if (!msg) return; input.value='';
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML += `<div class="chat-msg user"><div class="role">You</div>${msg}</div>`;
  msgs.scrollTop = msgs.scrollHeight;
  msgs.innerHTML += `<div class="chat-msg ai" id="thinking"><div class="role">🧠 Brain</div><span style="color:var(--text-muted);">Thinking...</span></div>`;
  try {
    const resp = await fetch(`${BASE_URL}/chat`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:msg}) });
    const data = await resp.json();
    document.getElementById('thinking').remove();
    msgs.innerHTML += `<div class="chat-msg ai"><div class="role">🧠 Brain</div>${data.response||'No response'}</div>`;
  } catch(e) {
    document.getElementById('thinking').remove();
    msgs.innerHTML += `<div class="chat-msg ai"><div class="role">🧠 Brain</div>⚠️ Error: ${e.message}</div>`;
  }
  msgs.scrollTop = msgs.scrollHeight;
}

async function runAgent(id) {
  const agent = allAgents.find(a => a.id === id);
  if (!agent) return showToast('Agent not found','error');
  const task = prompt(`What task for ${agent.name}?`, 'Analyze latest legal developments');
  if (!task) return;
  const div = document.getElementById('agent-result');
  if (!div) return;
  div.innerHTML = `<span style="color:var(--text-muted);">${agent.icon} ${agent.name} working...</span>`;
  try {
    const resp = await fetch(`${BASE_URL}/agents/${id}/task`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({task, agent_type:agent.category}) });
    const data = await resp.json();
    div.innerHTML = `<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;border-left:4px solid var(--accent);margin-top:12px;">
      <div style="font-weight:600;">🧠 ${data.agent||agent.name}</div>
      <div style="font-size:14px;color:var(--text-muted);margin-top:8px;">${data.response||data.result||'Complete'}</div>
    </div>`;
    showToast(`✅ ${agent.name} done`,'success');
  } catch(e) { div.innerHTML = `<div style="color:#ef4444;">Error: ${e.message}</div>`; }
}

async function hireCategory(cat) {
  const agents = allAgents.filter(a => a.category.toLowerCase() === cat);
  if (!agents.length) return;
  const task = prompt(`What task for ${agents.length} ${cat} agents?`, 'Analyze compliance requirements');
  if (!task) return;
  const div = document.getElementById('hire-result');
  if (!div) return;
  div.innerHTML = `<span style="color:var(--text-muted);">Hiring ${agents.length} agents...</span>`;
  try {
    const resp = await fetch(`${BASE_URL}/agents/orchestrate`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({task, categories:[cat]}) });
    const data = await resp.json();
    div.innerHTML = `<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;border-left:4px solid var(--gold);margin-top:12px;">

// ─── UTILITY ─────────────────────────────────────────────────────
function showToast(msg, type='info') {
  const existing = document.querySelector('.toast'); if (existing) existing.remove();
  const t = document.createElement('div'); t.className=`toast ${type}`; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}
async function refreshAll() {
  showToast('🔄 Refreshing...','info');
  await fetchAgents(); await fetchDashboard();
  if (currentTab==='dashboard') renderDashboard();
  else if (currentTab==='agents') renderAgents();
  else if (currentTab==='marketplace') renderMarketplace();
  document.getElementById('last-updated').textContent = new Date().toLocaleString();
  showToast('✅ Refreshed','success');
}

// ─── INIT ──────────────────────────────────────────────────────
async function init() {
  connectSSE();
  await fetchAgents();
  await fetchDashboard();
  renderDashboard();
  setInterval(async () => {
    await fetchDashboard();
    if (currentTab==='dashboard') renderDashboard();
  }, 60000);
}
init();
</script>
