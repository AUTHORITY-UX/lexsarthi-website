<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧠 Unknown Verdict · Brain</title>

  <style>
    /* ─── reset & variables ─── */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0a0e1a;
      --bg-card: #111827;
      --bg-card-hover: #1a2332;
      --border: #1e293b;
      --border-hover: #334155;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── header ─── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px; font-weight: 700; color: white;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header h1 span { color: var(--text-muted); font-weight: 400; }
    .header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      background: rgba(16,185,129,0.1);
      color: var(--success);
      border: 1px solid rgba(16,185,129,0.2);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    /* ─── layout ─── */
    .main-layout { display: flex; flex:1; overflow: hidden; }
    .sidebar {
      width: 280px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
    .sidebar-header h3 { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .sidebar-nav-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--text-muted);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-nav-item:hover { background: var(--bg-card-hover); color: var(--text); }
    .sidebar-nav-item.active {
      background: rgba(59,130,246,0.1);
      border-color: rgba(59,130,246,0.2);
      color: var(--text);
    }
    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }
    .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .content-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .content-header h2 { font-size: 16px; font-weight: 600; }
    .content-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    /* ─── cards ─── */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .dashboard-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
    }
    .dashboard-card .card-icon { font-size: 24px; margin-bottom: 4px; }
    .dashboard-card .card-value { font-size: 24px; font-weight: 700; }
    .dashboard-card .card-label { font-size: 12px; color: var(--text-muted); }

    .compliance-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .compliance-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
    }
    .compliance-card .compliance-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .compliance-card .compliance-name { font-size: 14px; font-weight: 600; }
    .compliance-status {
      padding: 2px 12px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
    }
    .compliance-status.pass { background: rgba(16,185,129,0.1); color: var(--success); }
    .compliance-status.partial { background: rgba(245,158,11,0.1); color: var(--warning); }
    .risk-meter { width: 100%; height: 6px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .risk-fill { height: 100%; border-radius: 4px; }
    .risk-fill.low { background: var(--success); }
    .risk-fill.medium { background: var(--warning); }
    .risk-fill.high { background: var(--danger); }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { border-color: var(--border-hover); }

    /* ─── chat ─── */
    .chat-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 20px;
    }
    .chat-messages {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 12px;
      padding: 8px;
    }
    .chat-msg {
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      max-width: 80%;
    }
    .chat-msg.user { background: rgba(59,130,246,0.15); margin-left: auto; border: 1px solid rgba(59,130,246,0.2); }
    .chat-msg.ai { background: var(--bg); border: 1px solid var(--border); }
    .chat-msg .msg-role { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
    .chat-msg .msg-content { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    .chat-input-row {
      display: flex;
      gap: 8px;
    }
    .chat-input-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
    }
    .chat-input-row input:focus { outline: none; border-color: var(--accent); }
    .chat-input-row button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    .chat-input-row button:hover { background: var(--accent-hover); }

    /* ─── logs ─── */
    .log-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin: 20px 0;
      max-height: 150px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }
    .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid var(--border);
    }
    .log-entry .time { color: var(--accent); }
    .log-entry .agent { color: var(--purple); font-weight: 600; }
    .log-entry .msg { color: var(--text); }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      max-width: 400px;
      z-index: 1000;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.info { border-left: 4px solid var(--accent); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .dashboard-grid { grid-template-columns: 1fr; }
      .compliance-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <!-- ============================================================ -->
  <!-- HEADER -->
  <!-- ============================================================ -->
  <div class="header">
    <div class="header-left">
      <div class="logo">🧠</div>
      <h1>Unknown Verdict <span>· Brain</span></h1>
    </div>
    <div class="header-right">
      <div class="status-badge"><div class="status-dot"></div><span id="status-text">Loading...</span></div>
      <button class="btn-secondary" onclick="refreshAll()" style="padding:4px 12px;font-size:12px;">🔄 Refresh</button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- MAIN LAYOUT -->
  <!-- ============================================================ -->
  <div class="main-layout">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>Intelligence Hub</h3>
      </div>
      <div class="sidebar-nav">
        <div class="sidebar-nav-item active" onclick="switchTab('dashboard')">📊 Dashboard</div>
        <div class="sidebar-nav-item" onclick="switchTab('compliance')">⚖️ Compliance</div>
        <div class="sidebar-nav-item" onclick="switchTab('agents')">🤖 Agents (250)</div>
        <div class="sidebar-nav-item" onclick="switchTab('news')">📰 News</div>
        <div class="sidebar-nav-item" onclick="switchTab('chat')">💬 Chat</div>
      </div>
      <div class="sidebar-footer">
        <div>⚡ Real‑time · 250 Agents · 6 LLMs</div>
        <div style="margin-top:4px"><span style="color:var(--success);">●</span> <span id="footer-status">System online</span></div>
      </div>
    </div>

    <!-- CONTENT AREA -->
    <div class="content-area">
      <div class="content-header">
        <h2 id="content-title">📊 Brain Dashboard</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <span style="font-size:12px;color:var(--text-muted)" id="last-updated">Just now</span>
          <button class="btn-secondary" onclick="refreshAll()" style="padding:4px 12px;font-size:12px;">🔄 Refresh</button>
        </div>
      </div>
      <div class="content-body" id="content-body">
        <div class="spinner"></div> Loading Brain...
      </div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- JAVASCRIPT – THE BRAIN ENGINE -->
  <!-- ============================================================ -->
  <script>
    // ──────────────────────────────────────────────────────────────
    // STATE
    // ──────────────────────────────────────────────────────────────
    const BASE_URL = window.location.origin;
    let currentTab = 'dashboard';
    let dashboardData = null;
    let agentLogs = [];
    const MAX_LOGS = 50;

    // ──────────────────────────────────────────────────────────────
    // FETCH REAL DATA FROM BACKEND
    // ──────────────────────────────────────────────────────────────
    async function fetchBrainData() {
      try {
        document.getElementById('status-text').textContent = 'Fetching...';
        const resp = await fetch(`${BASE_URL}/legal-intelligence/dashboard`);
        if (!resp.ok) throw new Error('Failed to fetch dashboard');
        const data = await resp.json();
        dashboardData = data;
        document.getElementById('status-text').textContent = `${data.total_content || 0} articles`;
        document.getElementById('footer-status').textContent = `Last update: ${new Date(data.timestamp).toLocaleTimeString()}`;
        document.getElementById('last-updated').textContent = new Date().toLocaleString();
        return data;
      } catch (e) {
        console.error('Brain fetch error:', e);
        document.getElementById('status-text').textContent = '⚠️ Offline';
        document.getElementById('footer-status').textContent = 'Error loading data';
        showToast('Failed to fetch brain data – using cached', 'error');
        return null;
      }
    }

    // ──────────────────────────────────────────────────────────────
    // SIMULATE AGENT LOG ACTIVITY (real-time feel)
    // ──────────────────────────────────────────────────────────────
    function addAgentLog(agent, message) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString();
      agentLogs.unshift({ time: timeStr, agent, message });
      if (agentLogs.length > MAX_LOGS) agentLogs.pop();
      renderAgentLogs();
    }

    function renderAgentLogs() {
      const container = document.getElementById('agent-log-container');
      if (!container) return;
      container.innerHTML = agentLogs.map(log => `
        <div class="log-entry">
          <span class="time">[${log.time}]</span>
          <span class="agent">${log.agent}</span>
          <span class="msg">${log.message}</span>
        </div>
      `).join('');
    }

    // Simulate a few initial logs
    function seedAgentLogs() {
      const agents = ['Research', 'Compliance', 'Analysis', 'Review', 'News'];
      const actions = [
        'scanning SCC Online for new judgments',
        'analysing EU AI Act updates',
        'cross‑referencing DPDPA compliance',
        'generating sentiment report',
        'fetching SCOTUSblog feed',
        'verifying citation accuracy',
        'extracting legal entities',
        'classifying topics'
      ];
      for (let i = 0; i < 8; i++) {
        const agent = agents[Math.floor(Math.random() * agents.length)];
        const action = actions[Math.floor(Math.random() * actions.length)];
        addAgentLog(agent, action);
      }
    }

    // Simulate new log every 10 seconds
    setInterval(() => {
      const agents = ['Research', 'Compliance', 'Analysis', 'Review', 'News', 'Drafting', 'Financial'];
      const actions = [
        'crawling RSS feed',
        'processing new article',
        'updating compliance scores',
        'checking for regulatory changes',
        'analysing case law',
        'generating summary',
        'extracting citations',
        'sentiment scoring'
      ];
      const agent = agents[Math.floor(Math.random() * agents.length)];
      const action = actions[Math.floor(Math.random() * actions.length)];
      addAgentLog(agent, action);
    }, 12000);

    // ──────────────────────────────────────────────────────────────
    // RENDER DASHBOARD
    // ──────────────────────────────────────────────────────────────
    function renderDashboard(data) {
      const container = document.getElementById('content-body');
      const articles = data?.top_content || [];
      const categories = data?.categories || {};
      const byJurisdiction = categories.by_jurisdiction || {};
      const totalArticles = data?.total_content || 0;
      const jurisdictions = Object.keys(byJurisdiction).length;

      // Compute compliance rate from jurisdiction coverage (dummy logic – you can refine)
      const compliantJurisdictions = ['India', 'US', 'UK', 'EU'].filter(j => byJurisdiction[j] && byJurisdiction[j] > 0);
      const complianceRate = Math.round((compliantJurisdictions.length / 4) * 100);

      let html = `
        <!-- Metrics -->
        <div class="dashboard-grid">
          <div class="dashboard-card">
            <div class="card-icon">📄</div>
            <div class="card-value">${totalArticles}</div>
            <div class="card-label">Legal Articles</div>
          </div>
          <div class="dashboard-card">
            <div class="card-icon">🌍</div>
            <div class="card-value">${jurisdictions}</div>
            <div class="card-label">Jurisdictions</div>
          </div>
          <div class="dashboard-card">
            <div class="card-icon">⚖️</div>
            <div class="card-value">${complianceRate}%</div>
            <div class="card-label">Compliance Rate</div>
          </div>
          <div class="dashboard-card">
            <div class="card-icon">🤖</div>
            <div class="card-value">250</div>
            <div class="card-label">Active Agents</div>
          </div>
        </div>

        <!-- Agent Log (real-time) -->
        <div class="log-container" id="agent-log-container">
          <div style="margin-bottom:6px;font-weight:600;color:var(--text);">🧠 Agent Activity Log</div>
          ${agentLogs.map(log => `
            <div class="log-entry">
              <span class="time">[${log.time}]</span>
              <span class="agent">${log.agent}</span>
              <span class="msg">${log.message}</span>
            </div>
          `).join('')}
        </div>

        <!-- Trending Topics -->
        <h3 style="margin:20px 0 12px;">🔥 Trending Topics</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
          ${Object.keys(categories.by_category || {}).slice(0,8).map(cat => `
            <span style="background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-size:12px;color:var(--text-muted);">
              #${cat} (${categories.by_category[cat]})
            </span>
          `).join('')}
        </div>

        <!-- Top Articles -->
        <h3 style="margin:20px 0 12px;">📰 Latest Intelligence</h3>
        ${articles.slice(0,5).map(a => `
          <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <span style="font-size:12px;color:var(--purple);">📍 ${a.jurisdiction || 'Global'} · ⭐ ${(a.legal_relevance || 0.5)*10}/10</span>
              <span style="font-size:11px;color:var(--text-muted);">${a.source || 'Unknown'}</span>
            </div>
            <div style="font-size:15px;font-weight:600;margin:8px 0;">
              <a href="${a.url || '#'}" target="_blank" style="color:var(--text);text-decoration:none;">${a.title || 'Untitled'}</a>
            </div>
            <div style="font-size:13px;color:var(--text-muted);line-height:1.6;max-height:80px;overflow:hidden;">
              ${(a.summary || a.text || '').substring(0,300)}...
            </div>
            <div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;">
              ${(a.categories || []).slice(0,3).map(c => `<span style="font-size:10px;background:var(--bg);padding:2px 8px;border-radius:12px;border:1px solid var(--border);">${c}</span>`).join('')}
              <button onclick="window.open('${a.url || '#'}','_blank')" style="color:var(--accent);background:none;border:none;cursor:pointer;font-size:12px;">🔗 Source</button>
            </div>
          </div>
        `).join('')}

        <!-- Chat (always at bottom) -->
        <div class="chat-container">
          <h4 style="margin-bottom:12px;">💬 Ask the Brain</h4>
          <div class="chat-messages" id="chat-messages">
            <div class="chat-msg ai">
              <div class="msg-role">AI</div>
              <div class="msg-content">Hello. I'm the Brain of Unknown Verdict. Ask me anything legal.</div>
            </div>
          </div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Your legal question..." onkeypress="if(event.key==='Enter') sendChat()" />
            <button onclick="sendChat()">Send</button>
          </div>
        </div>
      `;

      container.innerHTML = html;
      renderAgentLogs(); // re‑attach log rendering
    }

    // ──────────────────────────────────────────────────────────────
    // SEND CHAT
    // ──────────────────────────────────────────────────────────────
    async function sendChat() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;
      input.value = '';

      const messagesDiv = document.getElementById('chat-messages');
      messagesDiv.innerHTML += `
        <div class="chat-msg user">
          <div class="msg-role">You</div>
          <div class="msg-content">${message}</div>
        </div>
      `;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      messagesDiv.innerHTML += `
        <div class="chat-msg ai" id="thinking">
          <div class="msg-role">AI</div>
          <div class="msg-content"><span class="spinner"></span> Thinking...</div>
        </div>
      `;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const resp = await fetch(`${BASE_URL}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, jurisdiction: 'india' })
        });
        const data = await resp.json();
        const reply = data.response || data.message || 'No response.';
        document.getElementById('thinking').remove();
        messagesDiv.innerHTML += `
          <div class="chat-msg ai">
            <div class="msg-role">AI</div>
            <div class="msg-content">${reply}</div>
          </div>
        `;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      } catch (e) {
        document.getElementById('thinking').remove();
        messagesDiv.innerHTML += `
          <div class="chat-msg ai">
            <div class="msg-role">AI</div>
            <div class="msg-content">⚠️ Error: ${e.message}</div>
          </div>
        `;
      }
    }

    // ──────────────────────────────────────────────────────────────
    // TAB SWITCHING
    // ──────────────────────────────────────────────────────────────
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.sidebar-nav-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.sidebar-nav-item').forEach(el => {
        if (el.textContent.toLowerCase().includes(tab)) el.classList.add('active');
      });
      const titles = {
        dashboard: '📊 Brain Dashboard',
        compliance: '⚖️ Compliance Radar',
        agents: '🤖 Agent Network (250)',
        news: '📰 News Intelligence',
        chat: '💬 Brain Chat'
      };
      document.getElementById('content-title').textContent = titles[tab] || 'Dashboard';
      renderTabContent(tab);
    }

    function renderTabContent(tab) {
      const container = document.getElementById('content-body');
      if (tab === 'dashboard') {
        renderDashboard(dashboardData);
        return;
      }
      // For other tabs, show a placeholder with real data
      if (tab === 'compliance') {
        container.innerHTML = `
          <h3>⚖️ Compliance Radar</h3>
          <div class="compliance-grid">
            ${Object.entries(dashboardData?.categories?.by_jurisdiction || {}).map(([jur, count]) => `
              <div class="compliance-card">
                <div class="compliance-header">
                  <span class="compliance-name">📍 ${jur}</span>
                  <span class="compliance-status pass">${count} articles</span>
                </div>
                <div class="risk-meter"><div class="risk-fill low" style="width:${Math.min(count*5,100)}%;"></div></div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (tab === 'agents') {
        container.innerHTML = `
          <h3>🤖 250 Agent Network</h3>
          <p style="color:var(--text-muted);">Agent activity is streaming in real‑time. Check the dashboard for live logs.</p>
          <div class="dashboard-grid">
            ${['Research','Compliance','Analysis','Drafting','Review','News'].map(a => `
              <div class="dashboard-card">
                <div class="card-icon">🧠</div>
                <div style="font-size:18px;font-weight:600;">${a}</div>
                <div style="font-size:12px;color:var(--text-muted);">Active</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (tab === 'news') {
        const articles = dashboardData?.top_content || [];
        container.innerHTML = `
          <h3>📰 Latest Legal News</h3>
          ${articles.slice(0,8).map(a => `
            <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:12px;">
              <div style="font-size:12px;color:var(--text-muted);">${a.source || 'Unknown'} · ${new Date(a.published).toLocaleDateString()}</div>
              <div style="font-size:15px;font-weight:600;"><a href="${a.url}" target="_blank" style="color:var(--text);text-decoration:none;">${a.title}</a></div>
              <div style="font-size:13px;color:var(--text-muted);">${(a.summary || a.text || '').substring(0,200)}...</div>
            </div>
          `).join('')}
        `;
      } else if (tab === 'chat') {
        container.innerHTML = `
          <h3>💬 Brain Chat</h3>
          <div class="chat-container" style="margin-top:0;">
            <div class="chat-messages" id="chat-messages">
              <div class="chat-msg ai">
                <div class="msg-role">AI</div>
                <div class="msg-content">Ask me anything about law, compliance, or legal intelligence.</div>
              </div>
            </div>
            <div class="chat-input-row">
              <input type="text" id="chat-input" placeholder="Your question..." onkeypress="if(event.key==='Enter') sendChat()" />
              <button onclick="sendChat()">Send</button>
            </div>
          </div>
        `;
      }
    }

    // ──────────────────────────────────────────────────────────────
    // REFRESH
    // ──────────────────────────────────────────────────────────────
    async function refreshAll() {
      showToast('🔄 Refreshing Brain...', 'info');
      const data = await fetchBrainData();
      if (data) {
        dashboardData = data;
        renderTabContent(currentTab);
        showToast('✅ Brain updated', 'success');
      } else {
        showToast('⚠️ Refresh failed – using cached data', 'error');
      }
    }

    // ──────────────────────────────────────────────────────────────
    // TOAST NOTIFICATIONS
    // ──────────────────────────────────────────────────────────────
    function showToast(message, type = 'info') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}</span> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    // ──────────────────────────────────────────────────────────────
    // INIT – START THE BRAIN
    // ──────────────────────────────────────────────────────────────
    async function init() {
      seedAgentLogs();
      const data = await fetchBrainData();
      dashboardData = data || null;
      renderTabContent('dashboard');
      // Auto-refresh every 60 seconds
      setInterval(async () => {
        const newData = await fetchBrainData();
        if (newData) {
          dashboardData = newData;
          renderTabContent(currentTab);
        }
      }, 60000);
    }

    init();
  </script>

</body>
</html>
