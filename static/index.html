<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👁️ Unknown Verdict v43.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ─── RESET ─── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0e1a;
            --card: rgba(17, 24, 39, 0.9);
            --border: rgba(255,255,255,0.08);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #00d4ff;
            --purple: #7b2fbe;
            --gold: #ff6b35;
            --green: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ─── HEADER ─── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--card);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
        }
        .logo .eye { font-size: 28px; animation: blink 4s infinite; }
        @keyframes blink {
            0%,45%,55%,100% { opacity:1; }
            48%,52% { opacity:0; }
        }
        .logo .sub {
            color: var(--muted);
            font-weight: 400;
            font-size: 13px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(16,185,129,0.1);
            color: var(--green);
            border: 1px solid rgba(16,185,129,0.2);
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
        .btn {
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
        }
        .btn-primary:hover { background: #00b8d4; }

        /* ─── MAIN ─── */
        .main {
            display: flex;
            min-height: calc(100vh - 70px);
        }
        .sidebar {
            width: 220px;
            background: var(--card);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border);
            padding: 16px;
            flex-shrink: 0;
            height: calc(100vh - 70px);
            overflow-y: auto;
            position: sticky;
            top: 70px;
        }
        .sidebar h3 {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .sidebar-item {
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 4px;
            color: var(--muted);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .sidebar-item:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text);
        }
        .sidebar-item.active {
            background: rgba(0,212,255,0.1);
            color: var(--accent);
            border: 1px solid rgba(0,212,255,0.2);
        }
        .badge {
            background: var(--purple);
            color: #fff;
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 12px;
            margin-left: auto;
        }
        .sidebar-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--muted);
        }

        .content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            max-height: calc(100vh - 70px);
        }
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .content-header h2 {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ─── HERO ─── */
        .hero {
            text-align: center;
            padding: 30px 20px;
            background: radial-gradient(ellipse at center, rgba(123,47,190,0.12) 0%, transparent 70%);
            border-radius: 24px;
            margin-bottom: 24px;
        }
        .hero .eye-big {
            font-size: 80px;
            display: inline-block;
            animation: blink 4s infinite;
            cursor: pointer;
        }
        .hero h1 {
            font-size: 36px;
            background: linear-gradient(135deg, var(--accent), var(--purple), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero .sub {
            color: var(--muted);
            font-size: 16px;
        }
        .hero .infinity {
            font-size: 22px;
            color: var(--gold);
            margin-top: 4px;
        }
        .hero .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }
        .hero .tags span {
            padding: 4px 14px;
            border-radius: 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
        }

        /* ─── STATS ─── */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            text-align: center;
        }
        .stat .num {
            font-size: 28px;
            font-weight: 700;
        }
        .stat .num.cyan { color: var(--accent); }
        .stat .num.green { color: var(--green); }
        .stat .num.purple { color: var(--purple); }
        .stat .num.gold { color: var(--gold); }
        .stat .label { font-size: 11px; color: var(--muted); }

        /* ─── LOG ─── */
        .log {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            max-height: 160px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .log .title { font-weight: 600; margin-bottom: 8px; }
        .log .entry { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .log .entry .time { color: var(--accent); }
        .log .entry .agent { color: var(--gold); font-weight: 600; }
        .log .entry .action { color: var(--muted); }

        /* ─── AGENTS GRID ─── */
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        .agent-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .agent-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .agent-card .name { font-weight: 600; font-size: 14px; }
        .agent-card .cat { font-size: 12px; color: var(--muted); }
        .agent-card .price { font-size: 12px; color: var(--green); }

        /* ─── ARTICLES ─── */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
            margin-top: 12px;
        }
        .article-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .article-card:hover { border-color: var(--accent); }
        .article-card h4 { font-size: 15px; margin-bottom: 4px; }
        .article-card p { font-size: 13px; color: var(--muted); line-height: 1.4; }
        .article-card .meta { font-size: 11px; color: var(--muted); margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
        .article-card .tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            background: rgba(0,212,255,0.08);
            color: var(--accent);
            font-size: 10px;
            margin: 4px 4px 0 0;
        }

        /* ─── CHAT ─── */
        .chat-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 16px;
        }
        .chat-msgs {
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .chat-msg {
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.5;
        }
        .chat-msg.user {
            background: rgba(0,212,255,0.12);
            margin-left: auto;
        }
        .chat-msg.ai {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
        }
        .chat-msg .role { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
        .chat-row {
            display: flex;
            gap: 8px;
        }
        .chat-row input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 14px;
        }
        .chat-row input:focus { outline: none; border-color: var(--accent); }
        .chat-row button {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }
        .chat-row button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ─── TABS ─── */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .stats { grid-template-columns: 1fr 1fr; }
            .articles-grid, .agents-grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 28px; }
            .header { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <span class="eye">👁️</span>
            Unknown Verdict <span class="sub">· v43.0 · 114 Endpoints</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <div class="status-badge">
                <div class="dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
            <span style="font-size:12px;color:var(--muted);" id="eventCounter">Events: 0</span>
            <button class="btn" onclick="refreshAll()">🔄 Refresh</button>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <!-- Sidebar -->
        <div class="sidebar">
            <h3>🧠 Intelligence Hub</h3>
            <div class="sidebar-item active" onclick="switchTab('dashboard')">📊 Dashboard</div>
            <div class="sidebar-item" onclick="switchTab('agents')">🤖 Agents <span class="badge">530</span></div>
            <div class="sidebar-item" onclick="switchTab('articles')">📰 Articles</div>
            <div class="sidebar-item" onclick="switchTab('chat')">💬 Chat</div>
            <div class="sidebar-footer">
                <div>⚡ 530 Agents · 114 Endpoints</div>
                <div style="margin-top:4px;"><span style="color:var(--green);">●</span> <span id="footerStatus">Online</span></div>
                <div style="margin-top:4px;font-size:10px;color:var(--gold);">💰 Making money on the internet</div>
                <div style="margin-top:4px;font-size:10px;color:var(--muted);">♾️ 2026 – 2129</div>
                <div style="margin-top:4px;font-size:9px;color:var(--muted);">🔒 Zero Data Retention</div>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="content-header">
                <h2 id="contentTitle">📊 Brain Dashboard</h2>
                <span style="font-size:12px;color:var(--muted);" id="lastUpdated">Just now</span>
            </div>
            <div id="contentBody">
                <div style="text-align:center;padding:40px;color:var(--muted);">Loading the Brain...</div>
            </div>
        </div>
    </div>

    <script>
        // ════════════════════════════════════════════════════════════════════
        // CONFIG
        // ════════════════════════════════════════════════════════════════════

        const BASE = window.location.origin;
        let currentTab = 'dashboard';
        let allAgents = [];
        let eventCount = 0;
        let eventSource = null;

        // ─── SWITCH TAB ──────────────────────────────────────────────────────

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar-item').forEach(el => {
                const t = el.textContent.trim();
                if (t.includes('Dashboard') && tab === 'dashboard') el.classList.add('active');
                else if (t.includes('Agents') && tab === 'agents') el.classList.add('active');
                else if (t.includes('Articles') && tab === 'articles') el.classList.add('active');
                else if (t.includes('Chat') && tab === 'chat') el.classList.add('active');
            });

            const titles = {
                dashboard: '📊 Brain Dashboard',
                agents: '🤖 Agents (530)',
                articles: '📰 Legal Articles',
                chat: '💬 Chat'
            };
            document.getElementById('contentTitle').textContent = titles[tab] || 'Dashboard';

            const renderers = {
                dashboard: renderDashboard,
                agents: renderAgents,
                articles: renderArticles,
                chat: renderChatTab
            };
            if (renderers[tab]) renderers[tab]();
        }

        // ─── SSE ─────────────────────────────────────────────────────────────

        function connectSSE() {
            if (eventSource) { eventSource.close(); eventSource = null; }
            try {
                eventSource = new EventSource(`${BASE}/agent/events`);
                eventSource.onopen = () => {
                    document.getElementById('statusText').textContent = '🟢 Live';
                    document.getElementById('statusDot').style.background = '#10b981';
                    document.getElementById('footerStatus').textContent = 'SSE connected';
                };
                eventSource.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        eventCount++;
                        document.getElementById('eventCounter').textContent = `Events: ${eventCount}`;
                        const log = document.getElementById('agentLog');
                        if (log && data.agent) {
                            const entry = document.createElement('div');
                            entry.className = 'entry';
                            const time = new Date().toLocaleTimeString();
                            const finding = data.finding || data.action || 'processing...';
                            entry.innerHTML =
                                `<span class="time">[${time}]</span> <span class="agent">${data.agent}</span> <span class="action">${finding}</span>`;
                            log.prepend(entry);
                            while (log.children.length > 20) log.removeChild(log.lastChild);
                        }
                    } catch (err) { console.error('SSE parse:', err); }
                };
                eventSource.onerror = () => {
                    document.getElementById('statusText').textContent = '⚠️ Reconnecting...';
                    document.getElementById('statusDot').style.background = '#f59e0b';
                    if (eventSource) { eventSource.close(); eventSource = null; }
                    setTimeout(connectSSE, 3000);
                };
            } catch (e) { setTimeout(connectSSE, 3000); }
        }

        // ─── FETCH AGENTS ───────────────────────────────────────────────────

        async function fetchAgents() {
            try {
                const resp = await fetch(`${BASE}/agents`);
                if (resp.ok) {
                    const data = await resp.json();
                    allAgents = data.agents || [];
                } else {
                    allAgents = generateFallbackAgents();
                }
            } catch (e) {
                allAgents = generateFallbackAgents();
            }
            return allAgents;
        }

        function generateFallbackAgents() {
            const cats = [
                { name: 'Constitutional Law', cat: 'Lawyer', icon: '⚖️' },
                { name: 'Criminal Law', cat: 'Lawyer', icon: '⚖️' },
                { name: 'Civil Law', cat: 'Lawyer', icon: '⚖️' },
                { name: 'Corporate Law', cat: 'Lawyer', icon: '⚖️' },
                { name: 'Family Law', cat: 'Lawyer', icon: '⚖️' },
                { name: 'DPDPA Compliance', cat: 'Compliance', icon: '💼' },
                { name: 'GDPR Expert', cat: 'Compliance', icon: '💼' },
                { name: 'EU AI Act Assessor', cat: 'Compliance', icon: '💼' },
                { name: 'Legal Journalism', cat: 'Journalist', icon: '📰' },
                { name: 'News Curation', cat: 'Journalist', icon: '📰' },
                { name: 'Meditation Guide', cat: 'Spiritual', icon: '🧘' },
                { name: 'Ethics Coach', cat: 'Spiritual', icon: '🧘' },
            ];
            const agents = [];
            for (let i = 0; i < 530; i++) {
                const c = cats[i % cats.length];
                agents.push({
                    id: `agent_${String(i + 1).padStart(3, '0')}`,
                    name: `${c.name} Agent ${i + 1}`,
                    category: c.cat,
                    specialty: c.name,
                    icon: c.icon,
                    jurisdiction: ['India', 'US', 'UK', 'EU'][i % 4],
                    price: Math.floor(Math.random() * 30 + 5)
                });
            }
            return agents;
        }

        // ─── RENDER DASHBOARD ──────────────────────────────────────────────

        function renderDashboard() {
            const html = `
                <div class="hero">
                    <div class="eye-big" onclick="this.style.animation='none';setTimeout(()=>this.style.animation='blink 4s infinite',100)">👁️</div>
                    <h1>Unknown Verdict</h1>
                    <div class="sub">The Legal AGI · Est. 2026 – Publish 2129</div>
                    <div class="infinity">♾️ 2026 – 2129</div>
                    <div class="tags">
                        <span>🧠 Think</span>
                        <span>🗣️ Speak</span>
                        <span>👂 Listen</span>
                        <span>🔮 Self-Improve</span>
                        <span>📷 Images work too</span>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat"><div class="num cyan">114</div><div class="label">Endpoints</div></div>
                    <div class="stat"><div class="num green">${allAgents.length}</div><div class="label">Agents</div></div>
                    <div class="stat"><div class="num purple">50+</div><div class="label">Services</div></div>
                    <div class="stat"><div class="num gold">8</div><div class="label">Jurisdictions</div></div>
                </div>

                <div class="log" id="agentLog">
                    <div class="title">🧠 Real Agent Activity</div>
                    <div style="color:var(--muted);font-size:11px;padding:4px 0;">Waiting for agent events...</div>
                </div>

                <h3 style="margin:12px 0 8px;font-size:16px;">🔥 Trending Topics</h3>
                <div style="display:flex;flex-wrap:wrap;gap:6px;">
                    <span style="padding:4px 12px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:12px;color:var(--muted);">#AI Regulation</span>
                    <span style="padding:4px 12px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:12px;color:var(--muted);">#DPDPA</span>
                    <span style="padding:4px 12px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:12px;color:var(--muted);">#GDPR</span>
                    <span style="padding:4px 12px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:12px;color:var(--muted);">#EU AI Act</span>
                    <span style="padding:4px 12px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:12px;color:var(--muted);">#Contract Law</span>
                    <span style="padding:4px 12px;border-radius:12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-size:12px;color:var(--muted);">#IP Protection</span>
                </div>

                <h3 style="margin:16px 0 8px;font-size:16px;">📰 Latest Intelligence</h3>
                <div id="articlesPreview" style="color:var(--muted);font-size:13px;">Loading articles...</div>
                ${renderChat()}
            `;
            document.getElementById('contentBody').innerHTML = html;
            loadArticlesPreview();
        }

        // ─── LOAD ARTICLES PREVIEW ─────────────────────────────────────────

        async function loadArticlesPreview() {
            const container = document.getElementById('articlesPreview');
            if (!container) return;
            try {
                const resp = await fetch(`${BASE}/articles`);
                const data = await resp.json();
                if (data.articles && data.articles.length > 0) {
                    container.innerHTML = data.articles.slice(0, 3).map(a =>
                        `<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;">
                            <div style="font-weight:600;font-size:14px;">${a.title}</div>
                            <div style="font-size:12px;color:var(--muted);">${a.summary || a.content?.substring(0,150) || ''}</div>
                            <div style="font-size:11px;color:var(--muted);margin-top:4px;">📚 ${a.source || 'Unknown Verdict'}</div>
                        </div>`
                    ).join('');
                } else {
                    container.textContent = 'No articles available.';
                }
            } catch (e) {
                container.textContent = '⚠️ Could not load articles.';
            }
        }

        // ─── RENDER AGENTS ──────────────────────────────────────────────────

        function renderAgents() {
            const cats = {};
            allAgents.forEach(a => { cats[a.category] = (cats[a.category] || 0) + 1; });

            const html = `
                <h3 style="margin-bottom:12px;">🤖 530 Agents – All Categories</h3>
                <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
                    ${Object.entries(cats).map(([c, n]) =>
                        `<span style="font-size:13px;color:var(--muted);">${c}: <strong style="color:#fff;">${n}</strong></span>`
                    ).join('')}
                </div>
                <div class="agents-grid">
                    ${allAgents.slice(0,40).map(a => `
                        <div class="agent-card" onclick="runAgent('${a.id}')">
                            <div class="name">${a.icon} ${a.specialty || a.name}</div>
                            <div class="cat">${a.category} · ${a.jurisdiction || 'Global'}</div>
                            <div class="price">💰 $${a.price || Math.floor(Math.random()*20+5)}/task</div>
                        </div>
                    `).join('')}
                </div>
                ${allAgents.length > 40 ? `<div style="color:var(--muted);text-align:center;padding:16px;">+ ${allAgents.length - 40} more agents</div>` : ''}
                <div id="agentResult" style="margin-top:16px;"></div>
                ${renderChat()}
            `;
            document.getElementById('contentBody').innerHTML = html;
        }

        // ─── RENDER ARTICLES ───────────────────────────────────────────────

        function renderArticles() {
            const html = `
                <h3 style="margin-bottom:12px;">📰 Legal Intelligence Articles</h3>
                <div id="articlesList" style="color:var(--muted);">Loading articles...</div>
                ${renderChat()}
            `;
            document.getElementById('contentBody').innerHTML = html;
            loadArticlesFull();
        }

        async function loadArticlesFull() {
            const container = document.getElementById('articlesList');
            if (!container) return;
            try {
                const resp = await fetch(`${BASE}/articles`);
                const data = await resp.json();
                if (data.articles && data.articles.length > 0) {
                    container.innerHTML = `
                        <div class="articles-grid">
                            ${data.articles.map(a => `
                                <div class="article-card">
                                    <h4>${a.title}</h4>
                                    <p>${a.summary || a.content?.substring(0,150) || 'No summary available.'}</p>
                                    <div class="meta">
                                        <span>📚 ${a.source || 'Unknown Verdict'}</span>
                                        <span>${a.published_at ? new Date(a.published_at).toLocaleDateString() : ''}</span>
                                    </div>
                                    ${a.tags ? a.tags.map(t => `<span class="tag">#${t}</span>`).join('') : ''}
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    container.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px;">No articles available.</div>';
                }
            } catch (e) {
                container.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px;">⚠️ Could not load articles.</div>';
            }
        }

        // ─── RENDER CHAT TAB ───────────────────────────────────────────────

        function renderChatTab() {
            document.getElementById('contentBody').innerHTML = `<h3>💬 Chat</h3>${renderChat()}`;
        }

        // ─── RENDER CHAT ────────────────────────────────────────────────────

        function renderChat() {
            return `
                <div class="chat-box">
                    <h4 style="margin-bottom:10px;">💬 Ask the Brain</h4>
                    <div class="chat-msgs" id="chatMessages">
                        <div class="chat-msg ai">
                            <div class="role">🧠 Brain</div>
                            Hello. I'm the Unknown Verdict Brain with ${allAgents.length} agents. Ask me anything.
                        </div>
                    </div>
                    <div class="chat-row">
                        <input type="text" id="chatInput" placeholder="Ask a legal, journalistic, or spiritual question..." onkeypress="if(event.key==='Enter') sendChat()" />
                        <button id="sendBtn" onclick="sendChat()">Send</button>
                    </div>
                </div>
            `;
        }

        // ─── CHAT FUNCTION ──────────────────────────────────────────────────

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';

            const msgs = document.getElementById('chatMessages');
            const btn = document.getElementById('sendBtn');

            msgs.innerHTML += `<div class="chat-msg user"><div class="role">You</div>${msg}</div>`;
            msgs.scrollTop = msgs.scrollHeight;

            btn.disabled = true;
            btn.textContent = 'Thinking...';

            const thinkingId = 'think-' + Date.now();
            msgs.innerHTML += `<div class="chat-msg ai" id="${thinkingId}"><div class="role">🧠 Brain</div><span style="color:var(--muted);">Thinking...</span></div>`;
            msgs.scrollTop = msgs.scrollHeight;

            try {
                const resp = await fetch(`${BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });

                const el = document.getElementById(thinkingId);
                if (el) el.remove();

                if (!resp.ok) throw new Error(`Server returned ${resp.status}`);

                let data;
                try { data = await resp.json(); } catch (e) {
                    const text = await resp.text();
                    data = { response: text };
                }

                const reply = data.response || data.text || data.message || 'I received your message.';
                msgs.innerHTML += `<div class="chat-msg ai"><div class="role">🧠 Brain</div>${reply}</div>`;

            } catch (error) {
                const el = document.getElementById(thinkingId);
                if (el) el.remove();
                msgs.innerHTML += `<div class="chat-msg ai"><div class="role">🧠 Brain</div>
                    <span style="color:var(--gold);">⚠️ ${error.message}</span>
                    <br><span style="font-size:12px;color:var(--muted);">Please try again.</span>
                </div>`;
                console.error('Chat error:', error);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send';
                msgs.scrollTop = msgs.scrollHeight;
            }
        }

        // ─── RUN AGENT ─────────────────────────────────────────────────────

        async function runAgent(id) {
            const agent = allAgents.find(a => a.id === id);
            if (!agent) return alert('Agent not found');
            const task = prompt(`What task for ${agent.name}?`, 'Analyze latest legal developments');
            if (!task) return;

            const div = document.getElementById('agentResult');
            if (!div) return;
            div.innerHTML = `<span style="color:var(--muted);">${agent.icon} ${agent.name} working...</span>`;

            try {
                const resp = await fetch(`${BASE}/agent/${agent.id}/task`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task })
                });
                const data = await resp.json();
                div.innerHTML = `
                    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;border-left:4px solid var(--accent);margin-top:12px;">
                        <div style="font-weight:600;">🧠 ${data.agent || agent.name}</div>
                        <div style="font-size:14px;color:var(--muted);margin-top:6px;">${data.response || data.result || 'Complete'}</div>
                    </div>
                `;
            } catch (e) {
                div.innerHTML = `<div style="color:var(--danger);">Error: ${e.message}</div>`;
            }
        }

        // ─── REFRESH ────────────────────────────────────────────────────────

        async function refreshAll() {
            document.getElementById('statusText').textContent = '🔄 Refreshing...';
            await fetchAgents();
            if (currentTab === 'dashboard') renderDashboard();
            else if (currentTab === 'agents') renderAgents();
            else if (currentTab === 'articles') renderArticles();
            else if (currentTab === 'chat') renderChatTab();
            document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
            document.getElementById('statusText').textContent = '🟢 Live';
        }

        // ─── INIT ──────────────────────────────────────────────────────────

        async function init() {
            await fetchAgents();
            connectSSE();
            renderDashboard();
            setInterval(() => {
                if (currentTab === 'dashboard') {
                    const preview = document.getElementById('articlesPreview');
                    if (preview) loadArticlesPreview();
                }
            }, 60000);
        }

        window.sendChat = sendChat;
        window.switchTab = switchTab;
        window.refreshAll = refreshAll;
        window.runAgent = runAgent;

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
