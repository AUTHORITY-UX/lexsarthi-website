# =============================================================================
# docker-compose.yml – Multi-Container Setup
# =============================================================================

version: '3.8'

services:
  app:
    build: .
    container_name: unknown_verdict
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SERPAPI_KEY=${SERPAPI_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN}
      - LINKEDIN_USER_ID=${LINKEDIN_USER_ID}
      - ADMIN_SECRET=${ADMIN_SECRET}
    volumes:
      - ./legal_docs:/app/legal_docs
      - ./blog:/app/blog
      - ./models:/app/models
      - ./training_data:/app/training_data
    networks:
      - unknown_network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  redis:
    image: redis:7.4-alpine
    container_name: unknown_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - unknown_network
    command: redis-server --appendonly yes

  postgres:
    image: pgvector/pgvector:pg17
    container_name: unknown_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=unknown
      - POSTGRES_PASSWORD=${DB_PASSWORD:-unknown123}
      - POSTGRES_DB=unknown_verdict
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - unknown_network

volumes:
  redis_data:
  postgres_data:

networks:
  unknown_network:
    driver: bridge